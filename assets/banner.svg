<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="healGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(20px, -15px); opacity: 0.5; }
    }
    @keyframes scanLine {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes healPulse {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: 30; }
    }
    @keyframes badgeGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.7)); }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .orb2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: center; }
    .scanner { animation: scanLine 4s linear infinite; }
    .floating { animation: floatParticle 6s ease-in-out infinite; }
    .floating-delay { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .pulse-badge { animation: badgeGlow 4s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="orb1">
    <circle cx="200" cy="80" r="140" fill="#00f2fe" opacity="0.18" filter="url(#glow)"/>
  </g>
  <g class="orb2">
    <circle cx="1020" cy="240" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)"/>
    <circle cx="600" cy="320" r="120" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  </g>

  <!-- Geometric Tech Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Scanner Line (Underneath content) -->
  <g class="scanner">
    <line x1="80" y1="0" x2="1120" y2="0" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5" filter="url(#glow)" />
  </g>

  <!-- Floating Tech Decorators (Background Side Cards) -->
  <g class="floating" opacity="0.45">
    <rect x="70" y="230" width="130" height="40" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1"/>
    <text x="85" y="255" fill="#38bdf8" font-size="12" font-family="monospace">⚡ DOM Mutated</text>
  </g>
  <g class="floating-delay" opacity="0.55">
    <rect x="1000" y="70" width="135" height="40" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1"/>
    <text x="1015" y="95" fill="#10b981" font-size="12" font-family="monospace">✔ Auto-Healed</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, clean & never occluded -->
  <!-- Status Chip / Pill -->
  <g class="pulse-badge" transform="translate(600, 70)">
    <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#111827" stroke="url(#accentGrad)" stroke-width="1.8"/>
    <circle cx="-135" cy="0" r="5" fill="#10b981" filter="url(#subtleGlow)"/>
    <text x="-118" y="5" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    <rect x="75" y="-9" width="60" height="18" rx="9" fill="#10b981" opacity="0.2"/>
    <text x="87" y="4" fill="#34d399" font-size="10" font-weight="bold">AI + ML</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">
    Self-Healing <tspan fill="url(#accentGrad)">Test Automation</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="202" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="400" letter-spacing="0.2">
    Autonomous Locator Recovery &#8226; Intelligent Flakiness Elimination &#8226; Zero-Maintenance QA
  </text>

  <!-- Feature Tags / Capabilities -->
  <g transform="translate(600, 260)">
    <!-- Tag 1 -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">🎯 Smart Locators</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="22" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">🤖 Generative AI</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="77" y="22" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">✨ Zero Maintenance</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="600">🌐 Web &amp; Mobile</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
